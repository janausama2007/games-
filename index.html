<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لعبة تخمين الرقم 🎮</title>
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .card { background: white; display: inline-block; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        input[type="number"] { padding: 10px; font-size: 18px; width: 100px; text-align: center; margin-bottom: 10px; }
        button { padding: 10px 20px; font-size: 18px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .msg { margin-top: 20px; font-size: 18px; font-weight: bold; color: #333; }
        .nav-links { margin-top: 25px; border-top: 1px solid #eee; padding-top: 15px; }
        .nav-links a { color: #007bff; text-decoration: none; margin: 0 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎮 لعبة تخمين الرقم</h1>
        <p>اخترنا رقم مخفي من 1 لـ 100، تقدر تخمنه؟</p>
        
        <form method="POST">
            {% csrf_token %}
            <input type="number" name="guess" min="1" max="100" required autofocus> <br>
            <button type="submit">تخمين</button>
        </form>

        {% if message %}
            <div class="msg">{{ message }}</div>
        {% endif %}

        <div class="nav-links">
            <p>انتقل للعبة أخرى:</p>
            <a href="/game1/rps/">✂️ حجر ورقة مقص</a> | 
            <a href="/game1/quiz/">🧠 الأسئلة السريعة</a>
        </div>
    </div>
</body>
</html>
