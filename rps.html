<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حجر ورقة مقص ✂️</title>
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; margin-top: 50px; background-color: #eef2f7; }
        .card { background: white; display: inline-block; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        .btn { font-size: 18px; padding: 12px 15px; margin: 5px; border: none; border-radius: 8px; cursor: pointer; background: #007bff; color: white; }
        .result { margin-top: 20px; font-size: 20px; font-weight: bold; }
        .nav-links { margin-top: 25px; border-top: 1px solid #eee; padding-top: 15px; }
        .nav-links a { color: #007bff; text-decoration: none; margin: 0 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>✂️ لعبة حجر ورقة مقص</h1>
        <p>اختر حركتك للعب ضد الكمبيوتر:</p>
        
        <form method="POST">
            {% csrf_token %}
            <button class="btn" type="submit" name="choice" value="rock">🪨 حجر</button>
            <button class="btn" type="submit" name="choice" value="paper">📄 ورقة</button>
            <button class="btn" type="submit" name="choice" value="scissors">✂️ مقص</button>
        </form>

        {% if result %}
            <div class="result">
                <h3>{{ result }}</h3>
            </div>
        {% endif %}

        <div class="nav-links">
            <p>انتقل للعبة أخرى:</p>
            <a href="/game1/">🎮 تخمين الرقم</a> | 
            <a href="/game1/quiz/">🧠 الأسئلة السريعة</a>
        </div>
    </div>
</body>
</html>
