<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حجر ورقة مقص ✂️</title>
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; margin-top: 50px; background-color: #eef2f7; }
        .card { background: white; display: inline-block; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn { font-size: 20px; padding: 12px 20px; margin: 10px; border: none; border-radius: 8px; cursor: pointer; background: #007bff; color: white; }
        .result { margin-top: 20px; font-size: 20px; font-weight: bold; }
        a { display: inline-block; margin-top: 15px; color: #555; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>✂️ لعبة حجر ورقة مقص</h1>
        <p>اختر حركتك للعب ضد الكمبيوتر:</p>
        
        <form method="POST">
            {% csrf_token %}
            <button class="btn" type="submit" name="choice" value="rock">🪨 حجر</button>
            <button class="btn" type="submit" name="choice" value="paper">📄 ورقة</button>
            <button class="btn" type="submit" name="choice" value="scissors">✂️ مقص</button>
        </form>

        {% if result %}
            <div class="result">
                <h3>{{ result }}</h3>
            </div>
        {% endif %}

        <br>
        <a href="/game1/">الرجوع للعبة تخمين الرقم 🔄</a>
    </div>
</body>
</html>
